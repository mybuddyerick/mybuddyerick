name: Update GitHub profile metrics

on:
  schedule:
    # Daily at 05:23 UTC.
    - cron: '23 5 * * *'
  workflow_dispatch:

concurrency:
  group: github-profile-metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check metrics token
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo '::error::Add the METRICS_TOKEN repository Actions secret before running this workflow.'
            exit 1
          fi

      - name: Generate GitHub activity
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # latest (v3.34)
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: mybuddyerick
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Europe/Copenhagen
